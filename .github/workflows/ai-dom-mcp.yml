name: AI Dom MCP validation
on:
  pull_request:
    paths:
      - "app/api/ai-dom/**"
      - "app/api/mcp/**"
      - "app/dashboard/**"
      - "lib/ai-dom-mcp*"
      - "db/schema.sql"
      - "package.json"
      - "tests/ai-dom-mcp*"
      - ".github/workflows/ai-dom-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Next.js build
        run: npm run build
